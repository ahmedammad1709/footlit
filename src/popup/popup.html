<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Footlit</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img src="../icons/icon-48.png" width="34" height="34" alt="" />
    <h1 class="display">Footlit</h1>
    <label class="master"><span class="label" id="masterLabel">On</span><input type="checkbox" class="lever" id="master" aria-label="Footlit on or off" /></label>
  </header>
  <hr class="rule-double" />

  <div class="notice alert" id="stale" hidden>
    <p>This GitHub tab is still running an older Footlit. Reload it to rehearse.</p>
    <button class="btn primary" id="reloadTab">Reload tab</button>
  </div>
  <div class="notice" id="quietBar" hidden>
    <p id="quietText"></p>
    <button class="btn" id="endQuiet">End quiet</button>
  </div>

  <section aria-labelledby="h-theme">
    <p class="label" id="h-theme">Theme</p>
    <div class="tiles" id="themes" role="group" aria-label="Theme"></div>
    <p class="tagline" id="tagline"></p>
  </section>

  <section aria-labelledby="h-events">
    <p class="label" id="h-events">Events</p>
    <ul id="program" class="program"></ul>
    <p class="hint" id="hint"></p>
  </section>

  <hr class="rule-double" />
  <footer class="foot">
    <span class="label" id="tally"></span>
    <button class="btn" id="mute" title="Pause all shows for an hour">Quiet 1h</button>
    <button class="btn" id="more">All settings</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
