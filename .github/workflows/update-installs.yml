name: Update install count

# Manual only: press "Run workflow" and type the number from the Chrome Web Store dashboard.
# It writes site/src/data/installs.json; the site rounds it down to the last 50 ("312" shows "300+").
on:
  workflow_dispatch:
    inputs:
      installs:
        description: "Installs shown in the Chrome Web Store dashboard (a whole number, e.g. 312)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the new count
        env:
          INSTALLS: ${{ inputs.installs }}
        run: |
          if ! [[ "$INSTALLS" =~ ^[0-9]{1,6}$ ]]; then
            echo "Installs must be a whole number, got: $INSTALLS" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const file = "site/src/data/installs.json";
            const next = { installs: Number(process.env.INSTALLS), asOf: new Date().toISOString().slice(0, 10) };
            fs.writeFileSync(file, JSON.stringify(next, null, 2) + "\n");
            console.log("installs.json ->", next);
          '

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing changed, count is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/installs.json
          git commit -m "chore: installs count to ${INSTALLS}"
          git push
        env:
          INSTALLS: ${{ inputs.installs }}
